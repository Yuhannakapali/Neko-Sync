version: '3.8'

services:
  # Application
  nekosync:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://nekosync:password@postgres:5432/nekosync?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - JWT_SECRET=development-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
    networks:
      - nekosync-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nekosync
      POSTGRES_USER: nekosync
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nekosync -d nekosync"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nekosync-network

  # Redis (for caching and sessions)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - nekosync-network

  # Database Migration Tool
  migrate:
    image: migrate/migrate
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://nekosync:password@postgres:5432/nekosync?sslmode=disable"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nekosync-network

  # Development Tools
  adminer:
    image: adminer
    profiles: ["tools"]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - nekosync-network

  # Redis Admin Interface
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: ["tools"]
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - nekosync-network

volumes:
  postgres_data:
  redis_data:

networks:
  nekosync-network:
    driver: bridge
