# Go Build and Test Workflow (Nx-powered)
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: nekosync_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install Node dependencies
      run: npm ci --legacy-peer-deps

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Setup test environment
      run: |
        cp apps/backend/.env.test apps/backend/.env

    - name: Install Go dependencies
      run: npx nx deps backend

    - name: Format check
      run: npx nx format backend

    - name: Vet
      run: npx nx vet backend

    - name: Build
      run: npx nx build backend

    - name: Test
      run: npx nx test backend

    - name: Build production
      run: npx nx build backend --configuration=production

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: nekosync-binary
        path: apps/backend/bin/nekosync
        retention-days: 7
