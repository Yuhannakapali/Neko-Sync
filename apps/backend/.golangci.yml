# golangci-lint configuration v2.4.0+
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  go: "1.24"

issues:
  exclude-dirs:
    - vendor
    - tmp
    - bin
    - .git
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
    
    # Exclude some staticcheck messages
    - linters:
        - staticcheck
      text: "SA9003:"
    
    # Exclude lll issues for long lines with go:generate
    - linters:
        - lll
      source: "^//go:generate "

  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  sort-results: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gci
    - gofmt
    - gocritic
    - revive
    - misspell
    - unconvert
    - unparam
    - whitespace
  disable:
    - deadcode  # deprecated
    - varcheck  # deprecated
    - structcheck  # deprecated
    - golint  # deprecated
    - interfacer  # deprecated
    - scopelint  # deprecated
    - maligned  # deprecated
  presets:
    - bugs
    - comment
    - complexity
    - error
    - format
    - import
    - metalinter
    - module
    - performance
    - sql
    - style
    - test
    - unused
    - goimports
    - revive
    - gosec
    - misspell
    - unconvert
    - unparam
    - whitespace
    - goconst
    - gocritic
    - gocyclo
    - godot
    - dupl

linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(nekosync)
  
  gocyclo:
    min-complexity: 15
  
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - unnamedResult
      - whyNoLint
  
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"
  
  gosec:
    excludes:
      - G404 # Use of weak random number generator
  
  dupl:
    threshold: 100
